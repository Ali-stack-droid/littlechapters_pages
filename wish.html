<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF8ED">
<title>Send a Birthday Wish</title>
<meta name="description" content="Write a birthday wish for a little one in Little Chapters. No app or account needed.">
<meta property="og:title" content="Send a birthday wish 🎂">
<meta property="og:description" content="Write a birthday letter in Little Chapters. No app or account needed.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Great+Vibes&display=swap">
<style>
  :root {
    --bg: #FFF8ED;
    --bg-deep: #F6EBDA;
    --glass: rgba(255, 251, 244, 0.8);
    --glass-line: rgba(255, 255, 255, 0.9);
    --text: #20332A;
    --muted: #55625B;
    --line: #E6DDCF;
    --accent: #285943;
    --accent-ink: #FFFFFF;
    --accent-soft: #DFE6E2;
    --danger: #9B3B2E;
    --danger-soft: #FBEDE9;
    --paper: #FFFCF2;
    --paper-back: #F2EAD8;
    --paper-edge: rgba(120, 98, 60, 0.2);
    --margin-line: rgba(208, 96, 96, 0.42);
    --note: #FFF5CC;
    --letters-opacity: 0.62;
    --stage: rgba(255, 248, 237, 0.86);
    --shadow: 0 18px 44px rgba(60, 46, 26, 0.12);
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --hand: "Caveat", "Noteworthy", "Bradley Hand", "Segoe Print", cursive;
    --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141A17;
      --bg-deep: #0F1412;
      --glass: rgba(28, 36, 32, 0.82);
      --glass-line: rgba(255, 255, 255, 0.08);
      --text: #ECE7DE;
      --muted: #AEB8B1;
      --line: #2E3A33;
      --accent: #8CCBA9;
      --accent-ink: #10231A;
      --accent-soft: #233229;
      --danger: #F0A898;
      --danger-soft: #3A2622;
      --letters-opacity: 0.3;
      --stage: rgba(16, 21, 19, 0.9);
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg) 40%, var(--bg-deep) 100%) fixed, var(--bg);
    color: var(--text);
    font: 17px/1.55 var(--ui);
    overflow-x: hidden;
  }
  body.is-sending { overflow: hidden; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .letters { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: var(--letters-opacity); }
  .bg-letter { position: absolute; animation: drift var(--d) ease-in-out var(--delay) infinite alternate; will-change: transform; }
  .bg-letter > div { animation: land .9s cubic-bezier(.2, .8, .2, 1) var(--in) both; }
  .letters.settled .bg-letter > div { animation: none; }
  .bg-letter svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 8px 14px rgba(60, 46, 26, 0.14)); }
  .bg-letter.far { filter: blur(1.4px); }
  .bg-letter.far > div > div { opacity: .7; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(var(--dx), var(--dy)); } }
  @keyframes land { from { opacity: 0; transform: translateY(-18px) scale(.94); } to { opacity: 1; transform: none; } }

  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom)); }
  .brand { display: flex; justify-content: center; align-items: center; gap: 8px; color: var(--accent); font-weight: 650; letter-spacing: -0.02em; font-size: 17px; margin-bottom: 18px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px) saturate(1.15);
    backdrop-filter: blur(14px) saturate(1.15);
    border: 1px solid var(--glass-line);
    border-radius: 28px;
    box-shadow: var(--shadow);
  }

  .hero { position: relative; text-align: center; padding: 26px 22px 24px; overflow: hidden; }
  .hero-art { position: relative; width: 150px; height: 104px; margin: 0 auto 10px; }
  .hero-avatar {
    position: absolute; left: 50%; top: 14px; width: 80px; height: 80px; margin-left: -40px;
    display: grid; place-items: center; border-radius: 50%;
    font: 600 36px/1 var(--display); color: #3E5F78;
    background: linear-gradient(160deg, #EAF2F7, #AFC9DC);
    box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.85), 0 12px 26px rgba(62, 95, 120, 0.25);
  }
  .hero-balloon { position: absolute; animation: bob 3.6s ease-in-out infinite alternate; }
  .hero-balloon.one { left: 0; top: 0; animation-delay: -1.2s; }
  .hero-balloon.two { right: 2px; top: 10px; }
  .hero-balloon.three { right: 26px; top: -6px; animation-delay: -2.4s; }
  @keyframes bob { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-8px) rotate(4deg); } }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; padding: 5px 13px; border-radius: 999px; background: #FBF3DD; color: #7A5B1E; font-size: 13px; font-weight: 600; }
  h1 { font-family: var(--display); font-weight: 600; font-size: 31px; line-height: 1.15; margin: 12px 0 8px; letter-spacing: -0.015em; color: var(--text); }
  .lead { color: var(--muted); margin: 0 auto; max-width: 30em; font-size: 16px; }

  .step { margin-top: 16px; padding: 20px 16px 18px; }
  .step-head { display: flex; align-items: center; gap: 10px; margin: 0 4px 14px; }
  .step-num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; flex: none; }
  h2 { margin: 0; font: 600 19px/1.25 var(--display); letter-spacing: -0.01em; }
  .ideas-label { margin: 0 4px 8px; color: var(--muted); font-size: 14px; }
  .ideas { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 20px 14px; scrollbar-width: none; }
  .ideas::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; cursor: pointer; transition: transform .15s, background .15s;
  }
  .chip:active { transform: scale(.96); }
  .chip.is-picked { background: var(--accent-soft); border-color: var(--accent); }

  .paper {
    --ink: #3E5F78; --fill: #AFC9DC; --soft: #EAF2F7; --rule: rgba(62, 95, 120, 0.17);
    position: relative; color: var(--ink);
    background: radial-gradient(140% 90% at 0% 0%, #FFFFFF 0%, var(--paper) 55%), var(--paper);
    border: 1px solid var(--paper-edge); border-radius: 6px;
    padding: 18px 18px 18px 50px;
    box-shadow: 0 1px 0 rgba(120, 98, 60, 0.08), 0 16px 34px rgba(60, 46, 26, 0.16);
    transition: box-shadow .2s, color .3s;
  }
  .paper::before { content: ""; position: absolute; left: 34px; top: 0; bottom: 0; width: 1.5px; background: var(--margin-line); }
  .paper:focus-within { box-shadow: 0 1px 0 rgba(120, 98, 60, 0.08), 0 16px 34px rgba(60, 46, 26, 0.16), 0 0 0 3px color-mix(in srgb, var(--fill) 70%, transparent); }
  .paper-decor { position: absolute; right: 14px; bottom: 14px; opacity: .55; transform: rotate(10deg); pointer-events: none; }
  .paper-date { margin: 0 0 2px; text-align: right; font: 500 20px/1.2 var(--hand); opacity: .75; }
  .paper-greeting { margin: 0 0 2px; font: 36px/1.25 var(--script); }
  .paper-body, .paper textarea {
    display: block; width: 100%; margin: 0; padding: 0; border: 0; outline: 0; resize: none;
    font: 500 23px/32px var(--hand); color: var(--ink);
    background: transparent repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
    background-attachment: local;
    min-height: 160px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .paper-body { min-height: 96px; }
  .paper textarea::placeholder { color: var(--ink); opacity: .42; }
  .counter { margin: 4px 0 0; text-align: right; font-size: 12px; font-family: var(--ui); opacity: .7; }
  .paper-signoff { margin: 14px 0 0; font: 500 22px/1.2 var(--hand); }
  .paper-name, .paper-signature {
    display: block; width: 100%; margin: 0; padding: 2px 0 4px; border: 0; outline: 0; background: transparent;
    border-bottom: 1.5px dashed var(--rule); color: var(--ink); font: 34px/1.3 var(--script);
  }
  .paper-signature { border-bottom: 0; padding-right: 56px; }
  .paper-name::placeholder { color: var(--ink); opacity: .38; }
  .paper-name:focus { border-bottom-color: var(--ink); }
  .paper-hint { margin: 6px 0 0; padding-right: 48px; font: 13px/1.4 var(--ui); opacity: .7; }

  .envelopes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .envelope-option { position: relative; display: block; cursor: pointer; text-align: center; }
  .envelope-option input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .envelope-option .art { display: block; padding: 8px 4px 4px; border-radius: 16px; transition: transform .25s cubic-bezier(.2, .8, .2, 1), background .2s; }
  .envelope-option svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 5px 8px rgba(60, 46, 26, 0.16)); }
  .envelope-option .name { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .envelope-option input:checked + .art { transform: translateY(-4px) rotate(-4deg) scale(1.04); background: var(--accent-soft); }
  .envelope-option input:checked ~ .name { color: var(--accent); }
  .envelope-option input:focus-visible + .art { outline: 2px solid var(--accent); outline-offset: 2px; }

  .actions { margin-top: 18px; }
  button.primary {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    font: inherit; font-weight: 650; font-size: 17px;
    color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 999px; padding: 16px; cursor: pointer;
    box-shadow: 0 10px 24px rgba(40, 89, 67, 0.28); transition: transform .15s;
  }
  button.primary:active { transform: scale(.98); }
  button.primary[disabled] { opacity: .6; cursor: default; box-shadow: none; }
  button.link { display: block; font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 14px; margin: 6px auto 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .error { background: var(--danger-soft); color: var(--danger); border-radius: 14px; padding: 12px 14px; font-size: 15px; margin-top: 16px; }

  .sent-head { text-align: center; padding: 26px 20px 22px; }
  .sent-envelope { width: min(300px, 84%); margin: 0 auto 6px; transform: rotate(-3deg); }
  .sent-envelope svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 14px 22px rgba(60, 46, 26, 0.2)); }
  .sent-paper { margin-top: 16px; }
  .reply-note {
    position: relative; margin: 26px 12px 0; padding: 22px 18px 16px; background: var(--note); color: #5C4A1E;
    border-radius: 4px; transform: rotate(1.4deg); box-shadow: 0 10px 22px rgba(13, 24, 19, 0.2);
  }
  .reply-note::before { content: ""; position: absolute; top: -11px; left: 50%; width: 92px; height: 24px; margin-left: -46px; background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0, 0, 0, 0.05); transform: rotate(-3deg); }
  .reply-note strong { display: block; font: 600 15px/1.3 var(--ui); margin-bottom: 4px; }
  .reply-note p { margin: 0; font: 500 22px/1.35 var(--hand); white-space: pre-wrap; }
  .enter > * { animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; }
  .enter > *:nth-child(2) { animation-delay: .12s; }
  .enter > *:nth-child(3) { animation-delay: .24s; }
  .enter > *:nth-child(4) { animation-delay: .36s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .message-card { text-align: center; padding: 30px 22px 28px; }
  .message-art { position: relative; width: 170px; margin: 0 auto 6px; transform: rotate(-5deg); }
  .message-art svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 12px 18px rgba(60, 46, 26, 0.18)); }
  .message-badge { position: absolute; right: -14px; top: -14px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: var(--glass); box-shadow: 0 6px 14px rgba(60, 46, 26, 0.16); transform: rotate(5deg); }

  .loading { display: grid; place-items: center; gap: 14px; padding: 90px 0; color: var(--muted); font-size: 15px; }
  .loading svg { width: 120px; height: auto; animation: bob 1.4s ease-in-out infinite alternate; filter: drop-shadow(0 12px 16px rgba(60, 46, 26, 0.18)); }
  .note { color: var(--muted); font-size: 13px; text-align: center; margin: 22px auto 0; max-width: 28em; }
  .note a { color: var(--accent); }

  .stage { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; background: var(--stage); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); overflow: hidden; }
  .stage-target { display: flex; flex-direction: column; align-items: center; gap: 20px; opacity: 0; }
  .stage-avatar { position: relative; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font: 600 32px/1 var(--display); box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.9), 0 12px 26px rgba(60, 46, 26, 0.22); }
  .stage-avatar::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 2px dashed currentColor; opacity: .3; animation: spin 14s linear infinite; }
  .stage-to { margin: 0; font: 34px/1.1 var(--script); color: var(--text); }
  .stage-caption { margin: 22px 0 0; min-height: 1.6em; font: 500 24px/1.3 var(--hand); color: var(--muted); text-align: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .flyer { position: relative; width: var(--w); height: var(--h); flex: none; opacity: 0; }
  .env-inside { position: absolute; inset: 0; z-index: 1; border-radius: 9px; box-shadow: inset 0 10px 18px rgba(0, 0, 0, 0.12); }
  .env-flap { position: absolute; left: 0; top: 0; width: 100%; height: calc(var(--h) * .56); z-index: 1; transform-origin: 50% 0; transform: perspective(900px) rotateX(180deg); transform-style: preserve-3d; }
  .flap-face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .flap-face svg { display: block; width: 100%; height: 100%; }
  .flap-face.in { transform: rotateX(180deg); }
  .mini { position: absolute; z-index: 2; left: calc(var(--w) * .07); width: calc(var(--w) * .86); height: var(--l); top: calc(var(--h) * .25 - var(--l)); transform-style: preserve-3d; perspective: 1400px; }
  .fold { position: absolute; left: 0; width: 100%; height: calc(var(--l) / 3); transform-style: preserve-3d; }
  .fold.top { top: 0; transform-origin: 50% 100%; }
  .fold.mid { top: calc(var(--l) / 3); }
  .fold.bot { top: calc(var(--l) * 2 / 3); transform-origin: 50% 0; }
  .face { position: absolute; inset: 0; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; background: var(--paper); }
  .face.back { transform: rotateX(180deg); background: linear-gradient(180deg, var(--paper-back), #EDE3CD); box-shadow: inset 0 0 0 1px rgba(120, 98, 60, 0.14), inset 0 -6px 10px rgba(120, 98, 60, 0.08); }
  .fold.top .face.front { border-radius: 4px 4px 0 0; }
  .fold.bot .face.front { border-radius: 0 0 4px 4px; box-shadow: 0 10px 20px rgba(60, 46, 26, 0.12); }
  .mini-sheet { position: absolute; left: 0; width: 100%; padding: calc(var(--u) * 14px) calc(var(--u) * 14px) 0 calc(var(--u) * 36px); display: flex; flex-direction: column; }
  .mini-sheet::before { content: ""; position: absolute; left: calc(var(--u) * 24px); top: 0; bottom: 0; width: 1px; background: var(--margin-line); }
  .mini-date { margin: 0; text-align: right; font: 500 calc(var(--u) * 14px)/1.2 var(--hand); opacity: .7; }
  .mini-greeting { margin: 0; font: calc(var(--u) * 26px)/1.25 var(--script); }
  .mini-body { margin: 0; flex: 1; overflow: hidden; font: 500 calc(var(--u) * 16px)/calc(var(--u) * 22px) var(--hand); white-space: pre-wrap; overflow-wrap: anywhere; background: repeating-linear-gradient(to bottom, transparent 0 calc(var(--u) * 21px), var(--rule) calc(var(--u) * 21px) calc(var(--u) * 22px)); }
  .mini-sign { margin: calc(var(--u) * 6px) 0 0; font: 500 calc(var(--u) * 15px)/1.2 var(--hand); }
  .mini-name { margin: 0 0 calc(var(--u) * 16px); font: calc(var(--u) * 26px)/1.2 var(--script); }
  .env-pocket { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .env-pocket svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 -2px 3px rgba(0, 0, 0, 0.06)); }
  .env-seal { position: absolute; z-index: 5; left: 50%; width: var(--s); height: var(--s); margin-left: calc(var(--s) / -2); top: calc(var(--h) * .56 - var(--s) * .62); border-radius: 50%; display: grid; place-items: center; transform: scale(0); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25), inset 0 -3px 6px rgba(0, 0, 0, 0.2), inset 0 3px 5px rgba(255, 255, 255, 0.25); }
  .env-seal::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.35); }
  .spark { position: absolute; z-index: 11; pointer-events: none; font-size: 18px; line-height: 1; }

  @media (max-width: 359px) {
    .envelopes { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 27px; }
    .paper { padding-left: 44px; }
    .paper::before { left: 30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-letter, .bg-letter > div, .hero-balloon, .loading svg, .enter > *, .stage-avatar::after { animation: none !important; }
  }
</style>
</head>
<body>
<div class="letters" id="letters" aria-hidden="true"></div>

<main>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg></span>
    Little Chapters
  </div>

  <div id="loading" class="loading" role="status">
    <span id="loading-art" aria-hidden="true"></span>
    <span>Opening your invitation…</span>
  </div>

  <section id="state-message" hidden>
    <div class="glass message-card enter">
      <div class="message-art" aria-hidden="true"><span id="message-art"></span><span class="message-badge" id="message-emoji"></span></div>
      <h1 id="message-title"></h1>
      <p class="lead" id="message-body"></p>
    </div>
  </section>

  <section id="state-form" hidden>
    <header class="glass hero">
      <div class="hero-art" aria-hidden="true">
        <span class="hero-balloon one" id="balloon-one"></span>
        <span class="hero-balloon three" id="balloon-three"></span>
        <span class="hero-balloon two" id="balloon-two"></span>
        <span class="hero-avatar" id="hero-avatar"></span>
      </div>
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="form-title"></h1>
      <p class="lead" id="form-lead"></p>
    </header>

    <form id="wish-form" novalidate>
      <div class="glass step">
        <div class="step-head"><span class="step-num" aria-hidden="true">1</span><h2>Write your letter</h2></div>
        <p class="ideas-label" id="ideas-label">Need words? Tap one to start</p>
        <div class="ideas" id="ideas" role="group" aria-labelledby="ideas-label"></div>
        <div class="paper" id="paper">
          <span class="paper-decor" id="paper-decor" aria-hidden="true"></span>
          <p class="paper-date" id="paper-date"></p>
          <p class="paper-greeting" id="paper-greeting"></p>
          <label class="sr-only" for="message">Your wish</label>
          <textarea id="message" rows="5" maxlength="500" placeholder="Write your wish here…" required></textarea>
          <p class="counter" id="counter" hidden></p>
          <p class="paper-signoff">With love,</p>
          <label class="sr-only" for="name">Your name</label>
          <input id="name" class="paper-name" type="text" maxlength="40" autocomplete="given-name" placeholder="Your name" required>
          <p class="paper-hint">How the family will see you, like Aunt Sara or Nana.</p>
        </div>
      </div>

      <div class="glass step">
        <div class="step-head"><span class="step-num" aria-hidden="true">2</span><h2 id="card-label">Choose an envelope</h2></div>
        <div class="envelopes" id="envelopes" role="radiogroup" aria-labelledby="card-label"></div>
      </div>

      <div id="form-error" class="error" role="alert" hidden></div>
      <div class="actions">
        <button class="primary" id="send" type="submit"></button>
      </div>
    </form>
  </section>

  <section id="state-sent" hidden>
    <div class="enter">
      <div class="glass sent-head">
        <div class="sent-envelope" id="sent-envelope" aria-hidden="true"></div>
        <h1 id="sent-title"></h1>
        <p class="lead" id="sent-lead"></p>
      </div>

      label(150, 136, 'TO') +

        : '<path d="M152 172c9-12 18-13 23-4s12 8 18-2 15-8 20 0 14 5 26-5" fill="none" stroke="' + theme.ink + '" stroke-opacity=".45" stroke-width="2.6" stroke-linecap="round"/>') +

      '</svg>';

  var seeded = function (text) {
    var seed = 2166136261;
    for (var i = 0; i < text.length; i++) {

    };
  };

  var stored = function (key, value) {
    try {
      if (value === undefined) {
        return localStorage.getItem(key);
      }
      localStorage.setItem(key, value);
    } catch (error) {
      if (value === undefined) {
        return memoryStore[key] || null;
      }
      memoryStore[key] = value;
    }
    return value;
  };

  var dateOf = function (iso) {

    return dateOf(iso).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

    }
    if (days > 1) {

      headers: { 'Content-Type': 'application/json' },

    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        return { ok: response.ok, data: data };

      case 'too_many': return 'Too many wishes from this phone. Please try again in an hour.';
      case 'off': return 'This link was turned off by the family.';
      case 'full': return 'This birthday already has all the wishes it can hold.';
      case 'invalid': return (data.message || 'Please check your name and wish.');
      default: return "We couldn't send your wish. Check your connection and try again.";
    }
  };

  var wait = function (ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  };

  var play = function (element, frames, duration, extra) {
    return element.animate(frames, Object.assign({ duration: duration, easing: 'cubic-bezier(.22, .8, .24, 1)', fill: 'forwards' }, extra || {})).finished;
  };

  var miniSheet = function (index, letter, theme, length) {
    return '<div class="mini-sheet" style="top:' + (-index * length / 3) + 'px;height:' + length + 'px;color:' + theme.ink + ';--rule:' + theme.rule + '">' +
      '<p class="mini-date">' + esc(letter.date) + '</p>' +
      '<p class="mini-greeting">Dear ' + esc(info.childName) + ',</p>' +
      '<p class="mini-body">' + esc(letter.message) + '</p>' +
      '<p class="mini-sign">With love,</p>' +
      '<p class="mini-name">' + esc(letter.name) + '</p>' +
      '</div>';
  };

  var buildStage = function (theme, letter) {
    var width = Math.round(Math.max(180, Math.min(300, window.innerWidth - 64, (window.innerHeight - 250) / 1.5)));
    var height = Math.round(width * 0.64);
    var length = Math.round(width * 1.02);
    var above = Math.round(length - height * 0.25);
    var flapPath = 'M0 9Q0 0 9 0H331Q340 0 340 9L177 116Q170 123 163 116Z';
    var stage = document.createElement('div');
    stage.className = 'stage';
    stage.setAttribute('aria-hidden', 'true');
    stage.innerHTML =
      '<div class="stage-target">' +
        '<div class="stage-avatar" style="background:linear-gradient(160deg,' + theme.soft + ',' + theme.fill + ');color:' + theme.ink + '">' + esc((info.childName || '?').charAt(0).toUpperCase()) + '</div>' +
        '<p class="stage-to">To ' + esc(info.childName) + '</p>' +
      '</div>' +
      '<div style="padding-top:' + (above + 16) + 'px">' +
        '<div class="flyer" style="--w:' + width + 'px;--h:' + height + 'px;--l:' + length + 'px;--s:' + Math.round(width * 0.19) + 'px;--u:' + (width / 300).toFixed(3) + '">' +
          '<div class="env-inside" style="background:' + theme.inside + '"></div>' +
          '<div class="env-flap">' +
            '<div class="flap-face out"><svg viewBox="0 0 340 122" preserveAspectRatio="none"><path d="' + flapPath + '" fill="' + theme.flap + '" stroke="' + theme.ink + '" stroke-opacity=".16"/></svg></div>' +
            '<div class="flap-face in"><svg viewBox="0 0 340 122" preserveAspectRatio="none"><path transform="translate(0 122) scale(1 -1)" d="' + flapPath + '" fill="' + mix(theme.inside, '#FFFFFF', 0.12) + '"/></svg></div>' +
          '</div>' +
          '<div class="mini">' +
            '<div class="fold top"><div class="face front">' + miniSheet(0, letter, theme, length) + '</div><div class="face back"></div></div>' +
            '<div class="fold mid"><div class="face front">' + miniSheet(1, letter, theme, length) + '</div></div>' +
            '<div class="fold bot"><div class="face front">' + miniSheet(2, letter, theme, length) + '</div><div class="face back"></div></div>' +
          '</div>' +
          '<div class="env-pocket"><svg viewBox="0 0 340 218" preserveAspectRatio="none">' +
            '<path d="M0 9L170 112L340 9V208Q340 218 330 218H10Q0 218 0 208Z" fill="' + theme.pocket + '"/>' +
            '<path d="M0 9L170 112L340 9" fill="none" stroke="' + theme.ink + '" stroke-opacity=".14" stroke-width="1.2"/>' +
            '<path d="M4 214L170 132L336 214" fill="none" stroke="' + theme.ink + '" stroke-opacity=".16" stroke-width="1.2"/>' +
          '</svg></div>' +
          '<div class="env-seal" style="background:radial-gradient(circle at 35% 30%,' + mix(theme.seal, '#FFFFFF', 0.25) + ',' + theme.seal + ' 70%)">' + iconSvg(theme.key, theme.soft, Math.round(width * 0.085), 'stroke-width="2"') + '</div>' +
        '</div>' +
      '</div>' +
      '<p class="stage-caption"></p>';
    document.body.appendChild(stage);
    return { stage: stage, slide: Math.round(height * 0.92 - (height * 0.25 - length + length * 2 / 3)) };
  };

  var burst = function (stage, target, theme) {
    var box = target.getBoundingClientRect();
    var cx = box.left + box.width / 2;
    var cy = box.top + box.height / 2;
    var colors = [theme.fill, theme.ink, '#E3C989', '#E9B8AC'];
    var shapes = ['♥', '✦', '•', '♥', '✧'];
    for (var i = 0; i < 18; i++) {
      var spark = document.createElement('span');
      spark.className = 'spark';
      spark.textContent = shapes[i % shapes.length];
      spark.style.left = cx + 'px';
      spark.style.top = cy + 'px';
      spark.style.color = colors[i % colors.length];
      stage.appendChild(spark);
      var angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.3;
      var distance = 60 + Math.random() * 60;
      play(spark, [
        { transform: 'translate(-50%, -50%) scale(.4)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + (Math.cos(angle) * distance).toFixed(0) + 'px), calc(-50% + ' + (Math.sin(angle) * distance).toFixed(0) + 'px)) scale(1.1)', opacity: 0 }
      ], 900 + Math.random() * 400, { easing: 'cubic-bezier(.1, .7, .3, 1)' });
    }
  };

  var sendAnimation = function (theme, letter, request) {
    var built = buildStage(theme, letter);
    var stage = built.stage;
    var q = function (selector) { return stage.querySelector(selector); };
    var flyer = q('.flyer');
    var caption = function (text) { q('.stage-caption').textContent = text; };
    var bob = null;
    var result = null;
    var fold = function (selector, angle, lift) {
      return play(q(selector), [
        { transform: 'rotateX(0deg) translateZ(0px)' },
        { transform: 'rotateX(' + angle + 'deg) translateZ(' + lift + 'px)' }
      ], 640, { easing: 'cubic-bezier(.55, 0, .3, 1)' });
    };
    document.body.classList.add('is-sending');
    caption('Folding your letter…');
    return play(stage, [{ opacity: 0 }, { opacity: 1 }], 300)
      .then(function () {
        play(q('.stage-target'), [{ opacity: 0, transform: 'translateY(-12px) scale(.9)' }, { opacity: 1, transform: 'none' }], 520);
        return play(flyer, [{ opacity: 0, transform: 'translateY(36px) scale(.94)' }, { opacity: 1, transform: 'none' }], 560);
      })
      .then(function () { return wait(260); })
      .then(function () { return fold('.fold.bot', 180, -1); })
      .then(function () { return fold('.fold.top', -180, -2); })
      .then(function () {
        caption('Tucking it into the envelope…');
        return play(q('.mini'), [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(' + built.slide + 'px) scale(.97)' }], 720, { easing: 'cubic-bezier(.45, 0, .2, 1)' });
      })
      .then(function () {
        caption('Sealing it with love…');
        var flap = q('.env-flap');
        setTimeout(function () { flap.style.zIndex = '4'; }, 270);
        return play(flap, [{ transform: 'perspective(900px) rotateX(180deg)' }, { transform: 'perspective(900px) rotateX(0deg)' }], 560, { easing: 'cubic-bezier(.5, 0, .25, 1)' });
      })
      .then(function () {
        return play(q('.env-seal'), [
          { transform: 'scale(0) rotate(-30deg)', opacity: 0 },
          { transform: 'scale(1.2) rotate(8deg)', opacity: 1, offset: 0.7 },
          { transform: 'scale(1) rotate(0deg)', opacity: 1 }
        ], 460);
      })
      .then(function () {
        caption('Sending to ' + info.childName + '…');
        bob = flyer.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-7px)' }], { duration: 900, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' });
        return request;
      })
      .then(function (response) {
        result = response;
        if (bob) {
          bob.cancel();
        }
        if (!response.ok || !response.data.wish) {
          return play(stage, [{ opacity: 1 }, { opacity: 0 }], 320);
        }
        var avatar = q('.stage-avatar');
        var from = flyer.getBoundingClientRect();
        var to = avatar.getBoundingClientRect();
        var dx = to.left + to.width / 2 - (from.left + from.width / 2);
        var dy = to.top + to.height / 2 - (from.top + from.height / 2);
        caption('Off it goes!');
        return play(flyer, [
          { transform: 'translate(0px, 0px) scale(1) rotate(0deg)', opacity: 1 },
          { transform: 'translate(' + (-dx * 0.08).toFixed(0) + 'px, 28px) scale(1.04) rotate(4deg)', opacity: 1, offset: 0.2 },
          { transform: 'translate(' + (dx * 0.7).toFixed(0) + 'px, ' + (dy * 0.62).toFixed(0) + 'px) scale(.5) rotate(-10deg)', opacity: 1, offset: 0.72 },
          { transform: 'translate(' + dx.toFixed(0) + 'px, ' + dy.toFixed(0) + 'px) scale(.12) rotate(-16deg)', opacity: 0 }
        ], 1150, { easing: 'cubic-bezier(.42, 0, .3, 1)' })
          .then(function () {
            caption('Delivered to ' + info.childName + ' 💌');
            burst(stage, avatar, theme);
            play(avatar, [{ transform: 'scale(1)' }, { transform: 'scale(1.2)', offset: 0.35 }, { transform: 'scale(1)' }], 650, { easing: 'ease-out' });
            return wait(1250);
          })
          .then(function () { return play(stage, [{ opacity: 1 }, { opacity: 0 }], 400); });
      })
      .catch(function () {
        return request.then(function (response) { result = response; });
      })
      .then(function () {
        stage.remove();
        document.body.classList.remove('is-sending');
        return result;
      });
  };

  $('message').addEventListener('input', updateCounter);

  $('edit').addEventListener('click', function () {
    showForm(info.myWish);
  });

  $('wish-form').addEventListener('submit', function (event) {
    event.preventDefault();
    if (isSending) {
      return;
    }
    var name = $('name').value.trim();
    var message = $('message').value.trim();
    var error = $('form-error');
    if (!message) {
      error.textContent = 'Write a few words first, or tap an idea.';
      error.hidden = false;
      $('message').focus();
      return;
    }
    if (!name) {
      error.textContent = 'Sign your letter so the family knows who it is from.';
      error.hidden = false;
      $('name').focus();
      return;
    }
    isSending = true;
    error.hidden = true;
    $('send').disabled = true;
    stored(NAME_STORE, name);
    var card = selectedCard();
    var request = call({ action: 'send', name: name, message: message, card: card })
      .catch(function () { return { ok: false, data: null }; });
    var flow = reduceMotion || typeof document.body.animate !== 'function'
      ? request
      : sendAnimation(themeOf(card), { name: name, message: message, date: todayLabel() }, request);
    flow
      .then(function (result) {
        if (result && result.ok && result.data.wish) {
          showSent(result.data.wish);
          return;
        }
        error.textContent = failureText(result && result.data);
        error.hidden = false;
        error.scrollIntoView({ block: 'center', behavior: 'smooth' });
      })
      .then(function () {
        isSending = false;
        $('send').disabled = false;
      });
  });

  window.addEventListener('resize', function () {
    if (Math.abs(window.innerWidth - lettersWidth) > 40) {
      paintLetters(true);
    }
  });

  $('loading-art').innerHTML = envelopeBack(themeOf('balloons'));
  paintEnvelopes();
  paintLetters(false);

  var fail = function () {
    info = { status: 'error' };
    showMessage('📶', 'Something went wrong', 'Check your connection, then reload this page.');
  };

  if (!/^[a-f0-9]{32}$/.test(link)) {
    info = { status: 'missing' };
    render();
    return;
  }

  call({ action: 'info' })
    .then(function (result) {
      if (!result.ok || !result.data || result.data.status === 'error') {
        fail();
        return;
      }
      info = result.data;
      paintLetters(true);
      render();
    })
    .catch(fail);
})();
</script>
</body>
</html>
